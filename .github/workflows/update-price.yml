name: Update ANTAM buyback price

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: hourly 08:00–18:00 WIB, weekdays.
    - cron: "0 1-11 * * 1-5"

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch and record price
        run: python track_price.py

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv
          git diff --cached --quiet || git commit -m "Update ANTAM buyback price"
          git push
